server.port=${PORT:8080}

# Falls back to local persistent file './data/habitdb' if DB_URL is not set
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/habitdb;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.sql.init.mode=always